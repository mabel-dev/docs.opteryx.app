<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="900" height="830" viewBox="0 0 900 830" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8378"/>
    </marker>
    <marker id="arrow-native" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B75422"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="830" fill="#ffffff"/>

  <!-- ===== wires ===== -->
  <path d="M390,90 L390,116 L150,116 L150,136" fill="none" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750,140 L750,116 L510,116 L510,94" fill="none" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="150" y1="228" x2="150" y2="274" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="366" x2="150" y2="412" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="504" x2="150" y2="550" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="280" y1="598" x2="316" y2="598" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="598" x2="616" y2="598" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="750" y1="682" x2="750" y2="646" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="750" y1="554" x2="750" y2="508" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="416" x2="750" y2="370" stroke="#8a8378" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- physical planner -> executor: the plan crosses into native code here -->
  <path d="M750,278 L750,232" fill="none" stroke="#B75422" stroke-width="3" marker-end="url(#arrow-native)"/>

  <!-- ===== flow labels (masked over wires) ===== -->
  <g font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#6B6558" text-anchor="middle">
    <rect x="368" y="94" width="44" height="18" fill="#ffffff"/>
    <text x="390" y="107">SQL</text>

    <rect x="470" y="94" width="80" height="18" fill="#ffffff"/>
    <text x="510" y="107">RESULTS</text>

    <rect x="128" y="242" width="44" height="18" fill="#ffffff"/>
    <text x="150" y="255">SQL</text>

    <rect x="128" y="380" width="44" height="18" fill="#ffffff"/>
    <text x="150" y="393">AST</text>

    <rect x="128" y="518" width="44" height="18" fill="#ffffff"/>
    <text x="150" y="531">AST</text>

    <rect x="276" y="589" width="52" height="18" fill="#ffffff"/>
    <text x="302" y="602">PLAN</text>

    <rect x="574" y="589" width="52" height="18" fill="#ffffff"/>
    <text x="600" y="602">PLAN</text>

    <rect x="722" y="655" width="56" height="18" fill="#ffffff"/>
    <text x="750" y="668">STATS</text>

    <rect x="724" y="522" width="52" height="18" fill="#ffffff"/>
    <text x="750" y="535">PLAN</text>

    <rect x="724" y="384" width="52" height="18" fill="#ffffff"/>
    <text x="750" y="397">PLAN</text>
  </g>

  <!-- ===== USER (outside the engine) ===== -->
  <g>
    <rect x="310" y="20" width="280" height="70" rx="8" fill="#ffffff" stroke="#20232B" stroke-width="2.5"/>
    <text x="450" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#20232B">USER</text>
    <text x="450" y="72" text-anchor="middle" font-size="13.5" fill="#6B6558">SQL in, results out</text>
  </g>

  <!-- ===== left column: text becomes a plan (python, except Parser) ===== -->
  <!-- SQL Rewriter -->
  <g>
    <rect x="20" y="140" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="20" y="140" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="226" y="152" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="248" y="166.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="42" y="174" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">SQL REWRITER</text>
    <text x="42" y="198" font-size="13.5" fill="#6B6558">normalises the raw string</text>
  </g>

  <!-- Parser — native -->
  <g>
    <rect x="20" y="278" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="20" y="278" width="6" height="88" rx="3" fill="#B75422"/>
    <rect x="226" y="290" width="44" height="20" rx="5" fill="#F8EDE4"/>
    <text x="248" y="304.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#B75422">RS</text>
    <text x="42" y="312" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">PARSER</text>
    <text x="42" y="336" font-size="13.5" fill="#6B6558">sqlparser (Rust) &#8594; AST</text>
  </g>

  <!-- AST Rewriter -->
  <g>
    <rect x="20" y="416" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="20" y="416" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="226" y="428" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="248" y="442.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="42" y="450" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">AST REWRITER</text>
    <text x="42" y="474" font-size="13.5" fill="#6B6558">normalises query parameters</text>
  </g>

  <!-- Logical Planner -->
  <g>
    <rect x="20" y="554" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="20" y="554" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="226" y="566" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="248" y="580.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="42" y="588" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">LOGICAL PLANNER</text>
    <text x="42" y="612" font-size="13.5" fill="#6B6558">AST &#8594; relational plan graph</text>
  </g>

  <!-- ===== bottom middle: Plan Rewriter ===== -->
  <g>
    <rect x="320" y="554" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="320" y="554" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="526" y="566" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="548" y="580.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="342" y="588" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">PLAN REWRITER</text>
    <text x="342" y="612" font-size="13.5" fill="#6B6558">subqueries &amp; set-ops &#8594; joins</text>
  </g>

  <!-- ===== right column: refining the plan until it runs ===== -->
  <!-- Binder -->
  <g>
    <rect x="620" y="554" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="620" y="554" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="826" y="566" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="848" y="580.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="642" y="588" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">BINDER</text>
    <text x="642" y="612" font-size="13.5" fill="#6B6558">resolves names and types</text>
  </g>

  <!-- Optimizer -->
  <g>
    <rect x="620" y="416" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="620" y="416" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="826" y="428" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="848" y="442.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="642" y="450" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">OPTIMIZER</text>
    <text x="642" y="474" font-size="13.5" fill="#6B6558">rule-based &amp; cost-based passes</text>
  </g>

  <!-- Physical Planner — last python step -->
  <g>
    <rect x="620" y="278" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="620" y="278" width="6" height="88" rx="3" fill="#2E6E9E"/>
    <rect x="826" y="290" width="44" height="20" rx="5" fill="#EAF1F7"/>
    <text x="848" y="304.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="642" y="312" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">PHYSICAL PLANNER</text>
    <text x="642" y="336" font-size="13.5" fill="#6B6558">binds operators, hands off</text>
  </g>

  <!-- Executor — native -->
  <g>
    <rect x="620" y="140" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="620" y="140" width="6" height="88" rx="3" fill="#B75422"/>
    <rect x="826" y="152" width="44" height="20" rx="5" fill="#F8EDE4"/>
    <text x="848" y="166.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#B75422">RS</text>
    <text x="642" y="174" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">EXECUTOR</text>
    <text x="642" y="198" font-size="13.5" fill="#6B6558">native scheduler, morsels</text>
  </g>

  <!-- ===== Catalogue ===== -->
  <g>
    <rect x="620" y="682" width="260" height="88" rx="8" fill="#ffffff" stroke="#DCD6C7" stroke-width="1.5"/>
    <rect x="620" y="682" width="6" height="88" rx="3" fill="#5C7A52"/>
    <rect x="826" y="694" width="44" height="20" rx="5" fill="#EEF2EA"/>
    <text x="848" y="708.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#5C7A52">DB</text>
    <text x="642" y="716" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#20232B">CATALOGUE</text>
    <text x="642" y="740" font-size="13.5" fill="#6B6558">schemas + statistics</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="14.5" fill="#6B6558">
    <rect x="20" y="796" width="16" height="16" rx="3" fill="#2E6E9E"/>
    <text x="44" y="809">Python &#8212; plans and decides</text>

    <rect x="290" y="796" width="16" height="16" rx="3" fill="#B75422"/>
    <text x="314" y="809">Native &#8212; touches data</text>

    <rect x="530" y="796" width="16" height="16" rx="3" fill="#5C7A52"/>
    <text x="554" y="809">Catalogue &#8212; schemas &amp; stats</text>
  </g>
</svg>
