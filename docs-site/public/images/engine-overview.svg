<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1160" height="760" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-native" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C1571E"/>
    </marker>
  </defs>

  <!-- ===== wires ===== -->
  <path d="M520,90 L520,113 L190,113 L190,136" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970,140 L970,113 L640,113 L640,92" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="190" y1="212" x2="190" y2="256" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="332" x2="190" y2="376" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="452" x2="190" y2="496" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="300" y1="536" x2="466" y2="536" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="536" x2="856" y2="536" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="970" y1="608" x2="970" y2="576" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="970" y1="500" x2="970" y2="456" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="380" x2="970" y2="336" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- the one-way handover: physical planner -> executor -->
  <path d="M970,260 L970,216" fill="none" stroke="#C1571E" stroke-width="3" marker-end="url(#arrow-native)"/>
  <line x1="800" y1="238" x2="1150" y2="238" stroke="#C1571E" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="1148" y="256" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#C1571E">BOUNDARY &#183; CROSSED ONCE</text>

  <!-- ===== flow labels (masked over wires) ===== -->
  <g font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <rect x="502" y="94" width="34" height="16" fill="#ffffff"/>
    <text x="519" y="106">SQL</text>

    <rect x="602" y="94" width="66" height="16" fill="#ffffff"/>
    <text x="635" y="106">RESULTS</text>

    <rect x="173" y="226" width="34" height="16" fill="#ffffff"/>
    <text x="190" y="238">SQL</text>

    <rect x="173" y="346" width="34" height="16" fill="#ffffff"/>
    <text x="190" y="358">AST</text>

    <rect x="173" y="466" width="34" height="16" fill="#ffffff"/>
    <text x="190" y="478">AST</text>

    <rect x="360" y="520" width="44" height="16" fill="#ffffff"/>
    <text x="382" y="532">PLAN</text>

    <rect x="753" y="520" width="44" height="16" fill="#ffffff"/>
    <text x="775" y="532">PLAN</text>

    <rect x="931" y="583" width="46" height="16" fill="#ffffff"/>
    <text x="954" y="595">STATS</text>

    <rect x="931" y="470" width="44" height="16" fill="#ffffff"/>
    <text x="953" y="482">PLAN</text>

    <rect x="931" y="350" width="44" height="16" fill="#ffffff"/>
    <text x="953" y="362">PLAN</text>
  </g>

  <!-- ===== USER (outside the engine) ===== -->
  <g>
    <rect x="470" y="20" width="220" height="70" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="580" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#1a1a1a">USER</text>
    <text x="580" y="70" text-anchor="middle" font-size="11.5" fill="#4a4a4a">SQL in, results out</text>
  </g>

  <!-- ===== left column: text becomes a plan (python, except Parser) ===== -->
  <!-- SQL Rewriter -->
  <g>
    <rect x="80" y="140" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="252" y="150" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="270" y="162.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="98" y="170" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">SQL REWRITER</text>
    <text x="98" y="190" font-size="11.5" fill="#ffffff" fill-opacity="0.88">normalises the raw string</text>
  </g>

  <!-- Parser — native -->
  <g>
    <rect x="80" y="260" width="220" height="72" rx="8" fill="#C1571E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="252" y="270" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="270" y="282.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#C1571E">RS</text>
    <text x="98" y="290" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">PARSER</text>
    <text x="98" y="310" font-size="11.5" fill="#ffffff" fill-opacity="0.88">sqlparser (Rust) &#8594; AST</text>
  </g>

  <!-- AST Rewriter -->
  <g>
    <rect x="80" y="380" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="252" y="390" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="270" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="98" y="410" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">AST REWRITER</text>
    <text x="98" y="430" font-size="11.5" fill="#ffffff" fill-opacity="0.88">normalises query parameters</text>
  </g>

  <!-- Logical Planner -->
  <g>
    <rect x="80" y="500" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="252" y="510" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="270" y="522.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="98" y="530" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">LOGICAL PLANNER</text>
    <text x="98" y="550" font-size="11.5" fill="#ffffff" fill-opacity="0.88">AST &#8594; relational plan graph</text>
  </g>

  <!-- ===== bottom middle: Plan Rewriter ===== -->
  <g>
    <rect x="470" y="500" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="642" y="510" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="660" y="522.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="488" y="530" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">PLAN REWRITER</text>
    <text x="488" y="550" font-size="11.5" fill="#ffffff" fill-opacity="0.88">subqueries &amp; set-ops &#8594; joins</text>
  </g>

  <!-- ===== right column: refining the plan until it runs ===== -->
  <!-- Binder -->
  <g>
    <rect x="860" y="500" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="1032" y="510" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="1050" y="522.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="878" y="530" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">BINDER</text>
    <text x="878" y="550" font-size="11.5" fill="#ffffff" fill-opacity="0.88">resolves names and types</text>
  </g>

  <!-- Optimizer -->
  <g>
    <rect x="860" y="380" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="1032" y="390" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="1050" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="878" y="410" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">OPTIMIZER</text>
    <text x="878" y="430" font-size="11.5" fill="#ffffff" fill-opacity="0.88">rule-based &amp; cost-based passes</text>
  </g>

  <!-- Physical Planner — last python step -->
  <g>
    <rect x="860" y="260" width="220" height="72" rx="8" fill="#2E6E9E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="1032" y="270" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="1050" y="282.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#2E6E9E">PY</text>
    <text x="878" y="290" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">PHYSICAL PLANNER</text>
    <text x="878" y="310" font-size="11.5" fill="#ffffff" fill-opacity="0.88">binds operators, hands off</text>
  </g>

  <!-- Executor — native -->
  <g>
    <rect x="860" y="140" width="220" height="72" rx="8" fill="#C1571E" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="1032" y="150" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="1050" y="162.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#C1571E">RS</text>
    <text x="878" y="170" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">EXECUTOR</text>
    <text x="878" y="190" font-size="11.5" fill="#ffffff" fill-opacity="0.88">native scheduler, morsels</text>
  </g>

  <!-- ===== Catalogue ===== -->
  <g>
    <rect x="860" y="608" width="220" height="60" rx="8" fill="#5C7A52" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="1032" y="617" width="36" height="17" rx="4" fill="#ffffff"/>
    <text x="1050" y="629.5" text-anchor="middle" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#5C7A52">DB</text>
    <text x="878" y="637" font-family="Courier New, monospace" font-size="13.5" font-weight="700" fill="#ffffff">CATALOGUE</text>
    <text x="878" y="656" font-size="11.5" fill="#ffffff" fill-opacity="0.88">schemas + statistics</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="13" fill="#1a1a1a">
    <rect x="40" y="706" width="16" height="16" rx="3" fill="#2E6E9E"/>
    <text x="64" y="719">Python &#8212; plans and decides</text>

    <rect x="330" y="706" width="16" height="16" rx="3" fill="#C1571E"/>
    <text x="354" y="719">Native &#8212; touches data</text>

    <rect x="600" y="706" width="16" height="16" rx="3" fill="#5C7A52"/>
    <text x="624" y="719">Catalogue &#8212; schemas &amp; stats</text>

    <line x1="878" y1="714" x2="906" y2="714" stroke="#C1571E" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="914" y="719">one-way handover</text>
  </g>
</svg>
