<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .grid { display:grid; grid-template-columns: repeat(10, 1fr); gap:14px; }
  .ic { display:flex; flex-direction:column; gap:4px; align-items:center; }
  .ic img { width:20px; height:20px; color:#1F2E61; filter: brightness(0) saturate(100%) invert(19%) sepia(29%) saturate(1717%) hue-rotate(198deg) brightness(92%) contrast(89%); }
  .ic .n { font-family:var(--font-mono); font-size:9px; color:var(--muted); text-align:center; }
</style>
<div class="grid">
  <div class="ic"><img src="../assets/icons/action-run.svg"><div class="n">run</div></div>
  <div class="ic"><img src="../assets/icons/action-query.svg"><div class="n">query</div></div>
  <div class="ic"><img src="../assets/icons/action-ask.svg"><div class="n">ask</div></div>
  <div class="ic"><img src="../assets/icons/action-history.svg"><div class="n">history</div></div>
  <div class="ic"><img src="../assets/icons/action-settings.svg"><div class="n">settings</div></div>
  <div class="ic"><img src="../assets/icons/action-copy.svg"><div class="n">copy</div></div>
  <div class="ic"><img src="../assets/icons/download.svg"><div class="n">download</div></div>
  <div class="ic"><img src="../assets/icons/bookmark.svg"><div class="n">bookmark</div></div>
  <div class="ic"><img src="../assets/icons/database.svg"><div class="n">database</div></div>
  <div class="ic"><img src="../assets/icons/object-table.svg"><div class="n">table</div></div>
  <div class="ic"><img src="../assets/icons/object-view.svg"><div class="n">view</div></div>
  <div class="ic"><img src="../assets/icons/action-account.svg"><div class="n">account</div></div>
  <div class="ic"><img src="../assets/icons/action-tokens.svg"><div class="n">tokens</div></div>
  <div class="ic"><img src="../assets/icons/action-billing.svg"><div class="n">billing</div></div>
  <div class="ic"><img src="../assets/icons/action-sign-out.svg"><div class="n">sign-out</div></div>
  <div class="ic"><img src="../assets/icons/chevron-down.svg"><div class="n">chev-dn</div></div>
  <div class="ic"><img src="../assets/icons/chevron-right.svg"><div class="n">chev-rt</div></div>
  <div class="ic"><img src="../assets/icons/check-circle-fill.svg"><div class="n">check</div></div>
  <div class="ic"><img src="../assets/icons/x-circle-fill.svg"><div class="n">x-fill</div></div>
  <div class="ic"><img src="../assets/icons/exclamation-triangle.svg"><div class="n">warn</div></div>
</div>
</body></html>
