<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:flex; gap:40px; align-items:flex-end; flex-wrap:wrap; }
  .cell { display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .n { font-family:var(--font-display); font-size:11px; font-weight:500; color:var(--text-deep); }
  .wordmark { display:inline-flex; align-items:center; gap:12px; }
  .wordmark img { width:48px; height:48px; display:block; }
  .wordmark span { font-family:'Space Grotesk'; font-weight:600; font-size:26px; color:#1F2E61; letter-spacing:-0.02em; }
  .mono { display:inline-flex; align-items:center; gap:10px; }
  .mono img { width:40px; height:40px; display:block; color:#1F2E61; }
  .mono span { font-family:'Space Grotesk'; font-weight:600; font-size:22px; color:#1F2E61; letter-spacing:-0.02em; }
</style>
<div class="row">
  <div class="cell">
    <img src="../assets/opteryx-icon.svg" width="72" height="72">
    <div class="n">App mark</div>
  </div>
  <div class="cell">
    <div class="wordmark"><img src="../assets/opteryx-icon.svg"><span>Opteryx</span></div>
    <div class="n">Lockup — app mark</div>
  </div>
  <div class="cell">
    <div class="mono"><img src="../assets/opteryx-logo-outline.svg"><span>Opteryx</span></div>
    <div class="n">Lockup — monochrome (currentColor)</div>
  </div>
</div>
</body></html>
