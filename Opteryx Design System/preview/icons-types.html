<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:14px; }
  .ic { display:flex; flex-direction:column; gap:4px; align-items:center; }
  .ic img { width:22px; height:22px; }
  .ic .n { font-family:var(--font-mono); font-size:10px; color:var(--muted); text-align:center; }
</style>
<div class="grid">
  <div class="ic"><img src="../assets/icons/type-integer.svg"><div class="n">integer</div></div>
  <div class="ic"><img src="../assets/icons/type-decimal.svg"><div class="n">decimal</div></div>
  <div class="ic"><img src="../assets/icons/type-double.svg"><div class="n">double</div></div>
  <div class="ic"><img src="../assets/icons/type-varchar.svg"><div class="n">varchar</div></div>
  <div class="ic"><img src="../assets/icons/type-boolean.svg"><div class="n">boolean</div></div>
  <div class="ic"><img src="../assets/icons/type-date.svg"><div class="n">date</div></div>
  <div class="ic"><img src="../assets/icons/type-time.svg"><div class="n">time</div></div>
  <div class="ic"><img src="../assets/icons/type-timestamp.svg"><div class="n">timestamp</div></div>
  <div class="ic"><img src="../assets/icons/type-interval.svg"><div class="n">interval</div></div>
  <div class="ic"><img src="../assets/icons/type-jsonb.svg"><div class="n">jsonb</div></div>
  <div class="ic"><img src="../assets/icons/type-array.svg"><div class="n">array</div></div>
  <div class="ic"><img src="../assets/icons/type-varbinary.svg"><div class="n">varbinary</div></div>
  <div class="ic"><img src="../assets/icons/type-unknown.svg"><div class="n">unknown</div></div>
</div>
</body></html>
