<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sb { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-family:'IBM Plex Sans'; font-size:12px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
  .dot { width:6px; height:6px; border-radius:999px; }
  .s-ok { background:rgba(24,128,56,0.10); color:#188038; border-color:rgba(24,128,56,0.16); }
  .s-info { background:rgba(254,119,1,0.08); color:#FE7701; border-color:rgba(254,119,1,0.16); }
  .s-warn { background:rgba(200,148,39,0.08); color:#C89427; border-color:rgba(255,165,3,0.16); }
  .s-err { background:rgba(213,0,0,0.08); color:#D50000; border-color:rgba(213,0,0,0.16); }
  .s-muted { background:#F3FBFA; color:#3D4A4E; border-color:rgba(61,74,78,0.06); }
</style>
<div class="row">
  <span class="sb s-ok"><span class="dot" style="background:#188038"></span>Operational</span>
  <span class="sb s-info"><span class="dot" style="background:#FE7701"></span>Running</span>
  <span class="sb s-warn"><span class="dot" style="background:#C89427"></span>Degraded</span>
  <span class="sb s-err"><span class="dot" style="background:#D50000"></span>Failed</span>
  <span class="sb s-muted">Ready</span>
</div>
</body></html>
