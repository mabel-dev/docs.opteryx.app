<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:flex; gap:28px; align-items:flex-end; }
  .u { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .b { width:92px; height:72px; background:#fff; border:1px solid #D9E2E8; }
  .n { font-family:var(--font-display); font-size:12px; font-weight:600; color:var(--text-deep); }
  .h { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .note { margin-top:18px; font-family:var(--font-body); font-size:11px; color:var(--muted); max-width:520px; line-height:1.5; }
</style>
<div class="row">
  <div class="u"><div class="b" style="border-radius:5px"></div><div class="n">sharp</div><div class="h">5</div></div>
  <div class="u"><div class="b" style="border-radius:999px"></div><div class="n">pill</div><div class="h">999</div></div>
</div>
<div class="note">Two radii only. Use <b>sharp</b> (5px) for cards, panels, inputs, buttons &amp; surfaces. Use <b>pill</b> (999px) for badges, tags, chips &amp; circular elements. No mid-range curves.</div>
</body></html>
