<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .btn { display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk'; font-weight:600; font-size:13px; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid transparent; }
  .btn-primary-navy { background:#1F2E61; color:#fff; box-shadow:0 6px 18px rgba(7,121,124,0.08); }
  .btn-primary-teal { background:#07797C; color:#fff; }
  .btn-primary-orange { background:#FE7701; color:#fff; border-color:#FE7701; border-radius:5px; padding:6px 12px; font-size:12px; }
  .btn-secondary { background:transparent; color:#FE7701; border:1px solid rgba(7,121,124,0.08); }
  .btn-ghost { background:transparent; color:#5F6B78; border:1px solid #D9E2E8; border-radius:5px; padding:5px 12px; font-size:12px; font-weight:400; }
</style>
<div class="row">
  <button class="btn btn-primary-navy">Join the waitlist</button>
  <button class="btn btn-primary-teal">Start for Free</button>
  <button class="btn btn-primary-orange">Run</button>
  <button class="btn btn-secondary">Watch demo</button>
  <button class="btn btn-ghost">Cancel</button>
</div>
</body></html>
