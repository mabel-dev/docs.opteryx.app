<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .scale { display:flex; align-items:flex-end; gap:12px; }
  .unit { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .box { background:#F3FBFA; border:1px solid rgba(7,121,124,0.12); border-radius:4px; }
  .n { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
</style>
<div class="scale">
  <div class="unit"><div class="box" style="width:4px;height:4px"></div><div class="n">4</div></div>
  <div class="unit"><div class="box" style="width:8px;height:8px"></div><div class="n">8</div></div>
  <div class="unit"><div class="box" style="width:12px;height:12px"></div><div class="n">12</div></div>
  <div class="unit"><div class="box" style="width:16px;height:16px"></div><div class="n">16</div></div>
  <div class="unit"><div class="box" style="width:20px;height:20px"></div><div class="n">20</div></div>
  <div class="unit"><div class="box" style="width:24px;height:24px"></div><div class="n">24</div></div>
  <div class="unit"><div class="box" style="width:32px;height:32px"></div><div class="n">32</div></div>
  <div class="unit"><div class="box" style="width:40px;height:40px"></div><div class="n">40</div></div>
  <div class="unit"><div class="box" style="width:48px;height:48px"></div><div class="n">48</div></div>
  <div class="unit"><div class="box" style="width:64px;height:64px"></div><div class="n">64</div></div>
</div>
</body></html>
