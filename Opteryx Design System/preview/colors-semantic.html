<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .badge { display:inline-flex; align-items:center; border-radius:999px; padding:3px 10px; font-family:var(--font-body); font-weight:600; font-size:12px; border:1px solid transparent; }
  .cell { display:flex; flex-direction:column; gap:6px; }
  .n { font-family:var(--font-display); font-weight:500; font-size:11px; color:var(--text-deep); }
  .h { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
</style>
<div class="row">
  <div class="cell">
    <span class="badge" style="background:rgba(24,128,56,0.10); color:#146C2E; border-color:rgba(24,128,56,0.20);">Success</span>
    <div class="n">Success</div><div class="h">#146C2E</div>
  </div>
  <div class="cell">
    <span class="badge" style="background:rgba(25,103,210,0.10); color:#1967D2; border-color:rgba(25,103,210,0.20);">Info</span>
    <div class="n">Info</div><div class="h">#1967D2</div>
  </div>
  <div class="cell">
    <span class="badge" style="background:rgba(193,124,31,0.14); color:#7A4A00; border-color:rgba(193,124,31,0.32);">⚠ Warning</span>
    <div class="n">Warning</div><div class="h">#7A4A00</div>
  </div>
  <div class="cell">
    <span class="badge" style="background:rgba(213,0,0,0.08); color:#B00020; border-color:rgba(213,0,0,0.20);">Error</span>
    <div class="n">Error</div><div class="h">#B00020</div>
  </div>
</div>
</body></html>
