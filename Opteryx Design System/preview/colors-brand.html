<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .sw { display:flex; gap:14px; align-items:flex-start; }
  .chip { display:flex; flex-direction:column; gap:6px; }
  .dot { width:88px; height:88px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.06); }
  .name { font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--text-deep); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--muted); }
</style>
<div class="sw">
  <div class="chip"><div class="dot" style="background:#07797C"></div><div class="name">Teal</div><div class="hex">#07797C</div></div>
  <div class="chip"><div class="dot" style="background:#FE7701"></div><div class="name">Orange</div><div class="hex">#FE7701</div></div>
  <div class="chip"><div class="dot" style="background:#1F2E61"></div><div class="name">Navy</div><div class="hex">#1F2E61</div></div>
  <div class="chip"><div class="dot" style="background:#F3FBFA"></div><div class="name">Pale teal</div><div class="hex">#F3FBFA</div></div>
  <div class="chip"><div class="dot" style="background:#666699"></div><div class="name">Indigo line</div><div class="hex">#666699</div></div>
</div>
</body></html>
