<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .row { display:flex; flex-direction:column; gap:10px; max-width:380px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  label { font-family:'IBM Plex Sans'; font-weight:500; font-size:12px; color:#1F2E61; }
  input, select {
    font-family:'IBM Plex Sans'; font-size:13px; color:#3D4A4E;
    border:1px solid #D9E2E8; background:#fff;
    padding:6px 10px; border-radius:5px; outline:none; height:30px; box-sizing:border-box;
  }
  input:focus, select:focus { box-shadow: 0 0 0 3px rgba(7,121,124,0.10); border-color:#07797C; }

  /* custom select chevron — intentional position, not browser default */
  select {
    appearance:none; -webkit-appearance:none;
    padding-right:28px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235F6B78' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 10px center;
  }

  .search {
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid #D9E2E8; border-radius:5px;
    padding:0 8px; height:30px; box-sizing:border-box;
  }
  .search:focus-within { border-color:#07797C; box-shadow: 0 0 0 3px rgba(7,121,124,0.10); }
  .search svg { flex-shrink:0; }
  .search input { border:none; box-shadow:none; padding:0; flex:1; font-size:13px; height:auto; }
  .search input:focus { box-shadow:none; }
</style>
<div class="row">
  <div class="field"><label>Token name</label><input value="production-api-token" /></div>
  <div class="field"><label>Expiration</label><select><option>30 days</option><option>60 days</option><option>90 days</option></select></div>
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5F6B78" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.35-4.35"/></svg>
    <input placeholder="What's the ROI on our 'Fall' campaign?" />
  </div>
</div>
</body></html>
