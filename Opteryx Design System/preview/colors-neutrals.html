<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; }
  .cell { display:flex; flex-direction:column; gap:4px; }
  .sw { height:52px; border-radius:5px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.06); }
  .n { font-family:var(--font-display); font-weight:500; font-size:11px; color:var(--text-deep); }
  .h { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
</style>
<div class="grid">
  <div class="cell"><div class="sw" style="background:#FFFFFF"></div><div class="n">bg</div><div class="h">#FFFFFF</div></div>
  <div class="cell"><div class="sw" style="background:#F7FAFA"></div><div class="n">muted surf</div><div class="h">#F7FAFA</div></div>
  <div class="cell"><div class="sw" style="background:#F3F7F7"></div><div class="n">panel</div><div class="h">#F3F7F7</div></div>
  <div class="cell"><div class="sw" style="background:#E6EFEF"></div><div class="n">header surf</div><div class="h">#E6EFEF</div></div>
  <div class="cell"><div class="sw" style="background:#D2DEDE"></div><div class="n">border</div><div class="h">#D2DEDE</div></div>
  <div class="cell"><div class="sw" style="background:#8FA3A5"></div><div class="n">muted-2</div><div class="h">#8FA3A5</div></div>
  <div class="cell"><div class="sw" style="background:#5A6B6D"></div><div class="n">muted</div><div class="h">#5A6B6D</div></div>
  <div class="cell"><div class="sw" style="background:#3A4849"></div><div class="n">text</div><div class="h">#3A4849</div></div>
  <div class="cell"><div class="sw" style="background:#1D3A3B"></div><div class="n">text-deep</div><div class="h">#1D3A3B</div></div>
</div>
</body></html>
