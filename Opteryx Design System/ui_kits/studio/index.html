<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opteryx Studio — UI kit</title>
  <link rel="icon" href="../../assets/opteryx-favicon.svg" />
  <link rel="stylesheet" href="studio.css" />
  <script>
    /* Apply persisted theme as early as possible to avoid flash. */
    (function () {
      try {
        var t = localStorage.getItem('opteryx-theme');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Header.jsx" data-presets="react"></script>
  <script type="text/babel" src="Sidebar.jsx" data-presets="react"></script>
  <script type="text/babel" src="Editor.jsx" data-presets="react"></script>
  <script type="text/babel" src="Results.jsx" data-presets="react"></script>
  <script type="text/babel" src="SqlDrawer.jsx" data-presets="react"></script>
  <script type="text/babel" src="StatusBar.jsx" data-presets="react"></script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function App() {
      const [ask, setAsk] = useState('');
      const [showAi, setShowAi] = useState(false);
      const [activeTable, setActiveTable] = useState(null);
      const [editorTab, setEditorTab] = useState('q1');
      const [resultTab, setResultTab] = useState('results');
      const [running, setRunning] = useState(false);
      const [showBillingWarning, setShowBillingWarning] = useState(true);

      // null = collapsed; string = the active view id
      const [leftView, setLeftView]   = useState('datasets');
      const [rightView, setRightView] = useState('help');

      const toggleLeft  = (id) => setLeftView(v => v === id ? null : id);
      const toggleRight = (id) => setRightView(v => v === id ? null : id);

      const onAsk = () => { if (ask.trim()) setShowAi(true); };
      const onRun = () => { setRunning(true); setTimeout(() => setRunning(false), 600); };

      const cols = [
        leftView ? '232px' : '0px',
        '1fr',
        rightView ? '300px' : '0px',
      ].join(' ');

      return (
        <>
          <div className="ide">
            <Header />
            {showBillingWarning && (
              <SystemWarning onDismiss={() => setShowBillingWarning(false)}>
                Billing data is experiencing delays. Recent usage may not appear for up to 30 minutes.
              </SystemWarning>
            )}
            <div className="ide-main" style={{ gridTemplateColumns: cols }}>
              {leftView && (
                <aside className="sidebar">
                  <Sidebar
                    activeView={leftView}
                    activeTable={activeTable}
                    onSelectTable={setActiveTable}
                  />
                </aside>
              )}
              <div className="center">
                <EditorTabs active={editorTab} onChange={setEditorTab} />
                <EditorToolbar onRun={onRun} running={running} />
                <Editor />
                <Results tab={resultTab} onChangeTab={setResultTab} />
              </div>
              {rightView && (
                <aside className="drawer">
                  <SqlDrawer
                    activeView={rightView}
                    ask={ask} onAskChange={setAsk} onAsk={onAsk}
                  />
                </aside>
              )}
            </div>
            <StatusBar
              leftView={leftView} onToggleLeft={toggleLeft}
              rightView={rightView} onToggleRight={toggleRight}
            />
          </div>
          {showAi && (
            <AiOverlay
              question={ask || 'Show events by country for the last 30 days'}
              onClose={() => setShowAi(false)}
              onInsert={() => { setShowAi(false); setAsk(''); }}
            />
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
