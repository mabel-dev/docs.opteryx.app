# SEC-07: OWASP ZAP baseline (passive) scan of https://docs.opteryx.app through the fleet's reusable
# workflow. This file owns only the triggers and the target. The scan and the
# upload of every finding to opteryx.ops.pipeline_scan_findings are defined
# once in mabel-dev/.github. Report only: findings never fail it.
name: DAST Scan

on:
  schedule:
    # Same minute as security_scan.yaml (sha256 of the repo name mod 60), an hour later.
    - cron: '54 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dast-scan:
    permissions:
      contents: read
      id-token: write  # OIDC to authenticate.opteryx for the upload; no stored secret
    uses: mabel-dev/.github/.github/workflows/dast_scan.yaml@main
    with:
      url: https://docs.opteryx.app
