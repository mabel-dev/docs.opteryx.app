## Serving rules for the static export in the Cloud Run image.
##
## These mirror firebase.json so a page behaves the same whichever front door
## it is served from — same clean URLs, same cache lifetimes.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Firebase Hosting's cleanUrls: /docs/reference/sql/functions is stored as
    # functions.html. `trailingSlash` is off, so the export writes flat .html
    # files rather than directories.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Hashed filenames — the content behind a given name never changes.
    # `^~` stops the extension regexes below from stealing font requests here.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(woff|woff2|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # The agent SQL guides are read by tools as much as by people: serve
    # Markdown as UTF-8 text rather than nginx's default octet-stream.
    location ~* \.md$ {
        types { text/markdown md; }
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(html|txt|json)$ {
        add_header Cache-Control "no-cache";
    }
}
